<html>

<head>
    <style>
        body {
            margin: 0;
            background: #fff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            width: 100vw;
            background: #000;
            height: calc((9/16)*100vw);

        }
        .immediate{
            position: absolute;
            top: 0.5rem;
            right:0.5rem ;
            width: 250px;
            height: 250px;
            background-color: #fff;
            border:1px solid #252523;
            opacity: 0.5;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #launch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            border: 0;
            height: 3rem;
            padding: 1rem;
            color: #fff;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="launch" style="display: none;">
        <button>
            LOADING..
        </button>
    </div>
    <canvas id="c" width="800" height="450"></canvas>
    <script src="../js/echoes-of-the-ethersea-bundle.js"></script>
</body>

</html>
